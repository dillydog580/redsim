[package]
name = "redsim-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for redsim"
license = "MIT"

[lib]
name = "_redsim"
crate-type = ["cdylib"]

[dependencies]
redsim-core = { path = "../redsim-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

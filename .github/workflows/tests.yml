name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # oldest supported Python; ubuntu-latest (26.04) has no 3.9 builds
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test -p redsim-core
      - name: Build and install
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release -o dist
          python -m pip install --no-index --find-links dist redsim
      - name: Python tests (recorded game output, no game needed)
        run: python -m pytest -q tests
      - name: CLI smoke test
        run: |
          redsim --version
          redsim test examples/door_2x2.spec.json
